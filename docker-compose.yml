services:
  api:
    build: .
    container_name: teddy-api
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      MONGO_DB: ${MONGO_DB:-resume-analyzer}
      
      USE_LOCAL_LLM: "true"
      
      # Limita o uso de CPU para evitar sobrecarga no host de avaliação
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:7860"
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7
    container_name: teddy-mongodb
    restart: unless-stopped
    # tmpfs garante que os dados rodem direto na memória para máxima velocidade no teste,
    # respeitando a regra de "Não salvar ficheiros/currículos físicos"
    tmpfs:
      - /data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
