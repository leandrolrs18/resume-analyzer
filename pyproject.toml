[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teddy-resume-analyzer"
version = "1.0.0"
description = "Resume analysis API with OCR, RAG and semantic ranking."
readme = "README.md"

# FIX PRINCIPAL (era >=3.12)
requires-python = ">=3.11,<3.12"

dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  "pymupdf>=1.24.5,<2.0.0",
  "pytesseract>=0.3.13,<1.0.0",
  "motor>=3.5.1,<4.0.0",
  "prometheus-fastapi-instrumentator>=7.0.0,<8.0.0",

  # FIX CRÍTICO (numpy 2 quebrava torch)
  "numpy==1.26.4",
  "pillow>=10.4.0,<11.0.0",
  "llama-cpp-python>=0.2.85,<0.3.0",
  "spacy>=3.7.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
  "pytest-asyncio>=0.23.7,<1.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "httpx>=0.27.0,<1.0.0",
  "black>=24.4.2,<25.0.0",
  "ruff>=0.5.0,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
